<div class="flex h-screen bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white transition-colors duration-300">
  <!-- Sidebar -->
  <aside 
    [class]="isSidebarOpen ? 'w-64' : 'w-20'"
    class="bg-white dark:bg-slate-800 shadow-xl transition-all duration-300 z-50 flex flex-col h-full border-r border-slate-200 dark:border-slate-700">
    
    <div class="h-16 flex items-center justify-between px-4 border-b border-slate-200 dark:border-slate-700">
      <div class="flex items-center gap-3 overflow-hidden whitespace-nowrap">
        <div class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center shrink-0">
          <mat-icon class="text-white">local_hospital</mat-icon>
        </div>
        <span class="font-bold text-lg text-indigo-900 dark:text-indigo-200" [class.hidden]="!isSidebarOpen">
          MedERP
        </span>
      </div>
    </div>

    <!-- Navigation Menu (Dynamic based on Role) -->
    <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
      <ng-container *ngFor="let item of dynamicMenu()">
        <a [routerLink]="item.route" routerLinkActive="bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 font-medium"
           class="flex items-center gap-3 px-3 py-3 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700/50 transition-colors group">
          <mat-icon class="shrink-0 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors">{{ item.icon }}</mat-icon>
          <span [class.hidden]="!isSidebarOpen" class="truncate">{{ item.title }}</span>
        </a>
      </ng-container>
    </nav>

    <!-- Sidebar Footer -->
    <div class="p-4 border-t border-slate-200 dark:border-slate-700" *ngIf="authService.currentUserSignal() as user">
      <div class="flex items-center gap-3" [class.justify-center]="!isSidebarOpen">
        <div class="w-10 h-10 rounded-full bg-indigo-100 dark:bg-indigo-900/50 flex items-center justify-center shrink-0 text-indigo-600 dark:text-indigo-400 font-bold">
          {{ user.firstName[0] }}
        </div>
        <div [class.hidden]="!isSidebarOpen" class="overflow-hidden">
          <p class="text-sm font-medium text-slate-900 dark:text-white truncate">{{ user.firstName }} {{ user.lastName }}</p>
          <p class="text-xs text-slate-500 dark:text-slate-400 truncate">{{ user.role }}</p>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Content Wrapper -->
  <div class="flex-1 flex flex-col h-full min-w-0">
    <!-- Top Navbar -->
    <header class="h-16 bg-white/80 dark:bg-slate-800/80 backdrop-blur-md shadow-sm border-b border-slate-200 dark:border-slate-700 z-40 flex items-center justify-between px-4 lg:px-8 shrink-0 sticky top-0">
      <div class="flex items-center">
        <button mat-icon-button (click)="toggleSidebar()" class="text-slate-600 dark:text-slate-300">
          <mat-icon>menu</mat-icon>
        </button>
      </div>

      <div class="flex items-center gap-4">
        <button mat-icon-button class="text-slate-600 dark:text-slate-300 relative">
          <mat-icon>notifications</mat-icon>
          <span class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full border-2 border-white dark:border-slate-800"></span>
        </button>
        
        <ng-container *ngIf="authService.currentUserSignal() as user">
          <button mat-button [matMenuTriggerFor]="userMenu" class="!px-2">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-white font-medium text-sm">
                {{ user.firstName[0] }}
              </div>
              <span class="hidden md:block font-medium text-slate-700 dark:text-slate-200">{{ user.firstName }}</span>
              <mat-icon class="text-slate-500">arrow_drop_down</mat-icon>
            </div>
          </button>
          <mat-menu #userMenu="matMenu" class="!mt-2 !rounded-xl !p-2">
            <div class="px-4 py-2 border-b border-slate-100 dark:border-slate-700 mb-2">
              <p class="text-sm font-medium text-slate-900 dark:text-white">{{ user.email }}</p>
              <p class="text-xs text-slate-500">{{ user.role }}</p>
            </div>
            <button mat-menu-item>
              <mat-icon>person</mat-icon>
              <span>Profile</span>
            </button>
            <button mat-menu-item>
              <mat-icon>settings</mat-icon>
              <span>Settings</span>
            </button>
            <mat-divider class="!my-2"></mat-divider>
            <button mat-menu-item class="!text-red-600" (click)="logout()">
              <mat-icon class="text-red-600">logout</mat-icon>
              <span>Sign out</span>
            </button>
          </mat-menu>
        </ng-container>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto p-4 lg:p-8 relative z-0">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
