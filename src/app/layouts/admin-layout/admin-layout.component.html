<div class="flex h-screen bg-[#F4F7FE] text-[#1B254B] font-sans">
  <!-- Sidebar -->
  <aside 
    [class]="isSidebarOpen ? 'w-[280px]' : 'w-24'"
    class="bg-white m-4 rounded-[20px] shadow-[0_18px_40px_rgba(112,144,176,0.12)] transition-all duration-300 z-50 flex flex-col h-[calc(100vh-32px)] border border-white/50 relative overflow-hidden">
    
    <!-- Sidebar Header -->
    <div class="h-24 flex items-center justify-center px-6 border-b border-slate-100">
      <div class="flex items-center gap-4 overflow-hidden whitespace-nowrap" [class.justify-center]="!isSidebarOpen">
        <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-[#4318FF] to-[#00E5FF] flex items-center justify-center shrink-0 shadow-lg shadow-[#4318FF]/30">
          <mat-icon class="text-white text-2xl w-6 h-6">local_hospital</mat-icon>
        </div>
        <span class="font-black text-2xl tracking-tight text-[#1B254B]" [class.hidden]="!isSidebarOpen">
          MedERP
        </span>
      </div>
    </div>

    <!-- Navigation Menu (Dynamic based on Role) -->
    <nav class="flex-1 overflow-y-auto py-6 px-4 space-y-2">
      <ng-container *ngFor="let item of dynamicMenu()">
        <a [routerLink]="item.route" routerLinkActive="bg-[#E9E3FF] text-[#4318FF] font-bold shadow-sm" #rla="routerLinkActive"
           class="flex items-center gap-4 px-4 py-3.5 rounded-[14px] text-[#A3AED0] font-medium hover:bg-slate-50 transition-all duration-200 group">
           
          <div class="w-8 h-8 rounded-lg flex items-center justify-center transition-colors duration-200"
               [class]="rla.isActive ? 'text-[#4318FF]' : 'group-hover:text-[#4318FF] text-inherit'">
            <mat-icon class="shrink-0">{{ item.icon }}</mat-icon>
          </div>
          
          <span [class.hidden]="!isSidebarOpen" class="truncate text-base">{{ item.title }}</span>
        </a>
      </ng-container>
    </nav>

    <!-- Sidebar Footer -->
    <div class="p-6 border-t border-slate-100 bg-white" *ngIf="authService.currentUserSignal() as user">
      <a routerLink="/profile" class="flex items-center gap-4 hover:opacity-80 transition-opacity" [class.justify-center]="!isSidebarOpen">
        <img *ngIf="user.avatarUrl" [src]="user.avatarUrl" alt="Avatar"
             class="w-12 h-12 rounded-[14px] object-cover shrink-0 shadow-md">
        <div *ngIf="!user.avatarUrl" class="w-12 h-12 rounded-[14px] bg-[#E9E3FF] flex items-center justify-center shrink-0 text-[#4318FF] font-black text-lg shadow-md">
          {{ user.firstName[0] }}
        </div>
        <div [class.hidden]="!isSidebarOpen" class="overflow-hidden">
          <p class="text-sm font-bold text-[#1B254B] truncate">{{ user.firstName }} {{ user.lastName }}</p>
          <p class="text-xs font-bold text-[#A3AED0] uppercase tracking-wider truncate mt-0.5">{{ user.role }}</p>
        </div>
      </a>
    </div>
  </aside>

  <!-- Main Content Wrapper -->
  <div class="flex-1 flex flex-col h-full min-w-0 pr-4 py-4">
    
    <!-- Top Navbar (Glassmorphism) -->
    <header class="h-[76px] glass-panel rounded-[20px] mb-4 z-40 flex items-center justify-between px-6 shrink-0 sticky top-4">
      <div class="flex items-center">
        <button mat-icon-button (click)="toggleSidebar()" class="text-[#A3AED0] hover:text-[#4318FF] transition-colors w-10 h-10 bg-white shadow-sm rounded-full flex items-center justify-center">
          <mat-icon>menu</mat-icon>
        </button>
        
        <div class="ml-6 hidden md:block">
          <h2 class="text-xl font-bold text-[#1B254B]">Welcome back!</h2>
          <p class="text-xs text-[#A3AED0] font-medium">Here's what's happening today.</p>
        </div>
      </div>

      <div class="flex items-center gap-4 bg-white p-1.5 rounded-full shadow-[0_18px_40px_rgba(112,144,176,0.12)]">
        <button mat-icon-button class="text-[#A3AED0] hover:text-[#4318FF] transition-colors relative ml-2" [matMenuTriggerFor]="notifMenu">
          <mat-icon>notifications</mat-icon>
          <span class="absolute top-2 right-2 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-white"></span>
        </button>
        <mat-menu #notifMenu="matMenu" class="!mt-3 !rounded-2xl !p-0 !shadow-xl border border-slate-100 min-w-[320px]">
          <div class="px-5 py-4 border-b border-slate-100">
            <p class="text-sm font-black text-[#1B254B]">Notifications</p>
          </div>
          <div class="divide-y divide-slate-50">
            <button mat-menu-item class="!px-5 !py-4 !h-auto !rounded-none hover:bg-[#F4F7FE]">
              <div class="flex items-start gap-3 w-full">
                <div class="w-8 h-8 rounded-full bg-amber-50 flex items-center justify-center shrink-0">
                  <mat-icon class="text-amber-500 text-sm w-4 h-4">warning</mat-icon>
                </div>
                <div class="text-left">
                  <p class="text-xs font-bold text-[#1B254B]">Low pharmacy stock</p>
                  <p class="text-[10px] text-[#A3AED0] mt-0.5">Paracetamol stock below 100 units</p>
                </div>
              </div>
            </button>
            <button mat-menu-item class="!px-5 !py-4 !h-auto !rounded-none hover:bg-[#F4F7FE]">
              <div class="flex items-start gap-3 w-full">
                <div class="w-8 h-8 rounded-full bg-blue-50 flex items-center justify-center shrink-0">
                  <mat-icon class="text-blue-500 text-sm w-4 h-4">event</mat-icon>
                </div>
                <div class="text-left">
                  <p class="text-xs font-bold text-[#1B254B]">New appointment booked</p>
                  <p class="text-[10px] text-[#A3AED0] mt-0.5">Patient scheduled for 10:30 AM</p>
                </div>
              </div>
            </button>
            <button mat-menu-item class="!px-5 !py-4 !h-auto !rounded-none hover:bg-[#F4F7FE]">
              <div class="flex items-start gap-3 w-full">
                <div class="w-8 h-8 rounded-full bg-emerald-50 flex items-center justify-center shrink-0">
                  <mat-icon class="text-emerald-500 text-sm w-4 h-4">check_circle</mat-icon>
                </div>
                <div class="text-left">
                  <p class="text-xs font-bold text-[#1B254B]">Lab test completed</p>
                  <p class="text-[10px] text-[#A3AED0] mt-0.5">CBC results ready for PT-2024-081</p>
                </div>
              </div>
            </button>
          </div>
          <div class="px-5 py-3 border-t border-slate-100">
            <p class="text-xs text-center text-[#4318FF] font-bold cursor-pointer hover:underline">View all notifications</p>
          </div>
        </mat-menu>
        
        <ng-container *ngIf="authService.currentUserSignal() as user">
          <button mat-button [matMenuTriggerFor]="userMenu" class="!px-3 !py-1 !h-auto !rounded-full hover:bg-slate-50">
            <div class="flex items-center gap-3">
              <span class="hidden md:block font-bold text-[#1B254B] text-sm">{{ user.firstName }}</span>
              <img *ngIf="user.avatarUrl" [src]="user.avatarUrl" alt="Avatar"
                   class="w-8 h-8 rounded-full object-cover">
              <div *ngIf="!user.avatarUrl" class="w-8 h-8 rounded-full bg-[#4318FF] flex items-center justify-center text-white font-bold text-sm">
                {{ user.firstName[0] }}
              </div>
            </div>
          </button>
          
          <mat-menu #userMenu="matMenu" class="!mt-3 !rounded-2xl !p-2 !shadow-xl border border-slate-100 min-w-[200px]">
            <div class="px-5 py-3 border-b border-slate-100 mb-2">
              <p class="text-sm font-bold text-[#1B254B]">{{ user.email }}</p>
              <p class="text-xs font-bold text-[#A3AED0] uppercase tracking-wider mt-1">{{ user.role }}</p>
            </div>
            <button mat-menu-item routerLink="/profile" class="!rounded-xl hover:bg-slate-50">
              <mat-icon class="text-[#A3AED0]">person</mat-icon>
              <span class="font-medium text-[#1B254B]">My Profile</span>
            </button>
            <button mat-menu-item class="!rounded-xl hover:bg-slate-50">
              <mat-icon class="text-[#A3AED0]">settings</mat-icon>
              <span class="font-medium text-[#1B254B]">Settings</span>
            </button>
            <mat-divider class="!my-2"></mat-divider>
            <button mat-menu-item class="!rounded-xl hover:bg-red-50 !text-red-500" (click)="logout()">
              <mat-icon class="!text-red-500">logout</mat-icon>
              <span class="font-bold">Sign out</span>
            </button>
          </mat-menu>
        </ng-container>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto relative z-0 rounded-[20px]">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
