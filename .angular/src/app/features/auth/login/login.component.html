<div class="min-h-screen bg-slate-50 dark:bg-slate-900 flex flex-col justify-center py-12 sm:px-6 lg:px-8 transition-colors duration-300">
  <div class="sm:mx-auto sm:w-full sm:max-w-md animate-in">
    <div class="flex justify-center items-center gap-3 mb-6">
      <div class="w-12 h-12 rounded-full bg-indigo-600 flex items-center justify-center">
        <mat-icon class="text-white !text-2xl w-6 h-6">local_hospital</mat-icon>
      </div>
      <h2 class="text-3xl font-extrabold text-slate-900 dark:text-white">MedERP</h2>
    </div>
    <h2 class="mt-2 text-center text-xl font-medium text-slate-600 dark:text-slate-300">
      Sign in to your account
    </h2>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md animate-in" style="animation-delay: 0.1s;">
    <mat-card class="!rounded-2xl !shadow-lg">
      <mat-card-content class="!p-8">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
          
          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Email address</mat-label>
            <input matInput formControlName="email" type="email" placeholder="admin@hospital.com">
            <mat-icon matPrefix class="mr-2 text-slate-400">email</mat-icon>
            <mat-error *ngIf="loginForm.get('email')?.hasError('required')">Email is required</mat-error>
            <mat-error *ngIf="loginForm.get('email')?.hasError('email')">Please enter a valid email</mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Password</mat-label>
            <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password">
            <mat-icon matPrefix class="mr-2 text-slate-400">lock</mat-icon>
            <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button" [attr.aria-label]="'Hide password'">
              <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
            </button>
            <mat-error *ngIf="loginForm.get('password')?.hasError('required')">Password is required</mat-error>
          </mat-form-field>

          <div class="flex items-center justify-between !mt-4">
            <div class="flex items-center">
              <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-slate-300 rounded">
              <label for="remember-me" class="ml-2 block text-sm text-slate-900 dark:text-slate-300">
                Remember me
              </label>
            </div>

            <div class="text-sm">
              <a href="#" class="font-medium text-indigo-600 hover:text-indigo-500">
                Forgot your password?
              </a>
            </div>
          </div>

          <div class="!mt-6">
            <button mat-flat-button color="primary" type="submit" class="w-full !py-6 !text-lg" [disabled]="loginForm.invalid || isLoading">
              <span *ngIf="!isLoading">Sign in</span>
              <span *ngIf="isLoading" class="flex items-center gap-2">
                <mat-icon class="animate-spin">autorenew</mat-icon>
                Signing in...
              </span>
            </button>
          </div>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
</div>
