<div class="p-8 space-y-6">
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-3xl font-black text-slate-800 tracking-tight">User Management</h1>
      <p class="text-slate-500 font-medium">Assign roles and manage system access for all employees.</p>
    </div>
  </div>

  <mat-card class="!rounded-3xl !shadow-sm border border-slate-100 overflow-hidden">
    <table mat-table [dataSource]="users()" class="w-full">
      
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef class="!bg-slate-50 !py-6 !font-bold !text-slate-500 uppercase tracking-widest text-xs">Name</th>
        <td mat-cell *matCellDef="let user" class="!py-6">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center font-black">
              {{ user.firstName[0] }}{{ user.lastName[0] }}
            </div>
            <div>
              <div class="font-bold text-slate-800">{{ user.firstName }} {{ user.lastName }}</div>
              <div class="text-xs text-slate-400 font-medium">ID: {{ user.id }}</div>
            </div>
          </div>
        </td>
      </ng-container>

      <!-- Email Column -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef class="!bg-slate-50 !py-6 !font-bold !text-slate-500 uppercase tracking-widest text-xs">Email</th>
        <td mat-cell *matCellDef="let user" class="!py-6 text-slate-600 font-medium">{{ user.email }}</td>
      </ng-container>

      <!-- Role Column -->
      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef class="!bg-slate-50 !py-6 !font-bold !text-slate-500 uppercase tracking-widest text-xs">Role</th>
        <td mat-cell *matCellDef="let user" class="!py-6">
          <span [class]="'px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-tighter border ' + getRoleClass(user.role)">
            {{ user.role }}
          </span>
        </td>
      </ng-container>

      <!-- Status Column -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef class="!bg-slate-50 !py-6 !font-bold !text-slate-500 uppercase tracking-widest text-xs">Status</th>
        <td mat-cell *matCellDef="let user" class="!py-6">
          <div class="flex items-center gap-2">
            <div [class]="'w-2 h-2 rounded-full ' + (user.isActive ? 'bg-emerald-500' : 'bg-slate-300')"></div>
            <span class="text-xs font-bold text-slate-600">{{ user.isActive ? 'Active' : 'Inactive' }}</span>
          </div>
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="!bg-slate-50 !py-6 !font-bold !text-slate-500 uppercase tracking-widest text-xs text-right">Actions</th>
        <td mat-cell *matCellDef="let user" class="!py-6 text-right">
          <button mat-icon-button class="!text-indigo-600" [routerLink]="['/profile', user.id]">
            <mat-icon>settings</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-slate-50 transition"></tr>
    </table>
  </mat-card>
</div>
