<div class="flex h-screen bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white transition-colors duration-300">
  <!-- Sidebar -->
  <aside 
    [class]="isSidebarOpen ? 'w-64' : 'w-20'"
    class="bg-white dark:bg-slate-800 shadow-xl transition-all duration-300 z-50 flex flex-col h-full border-r border-slate-200 dark:border-slate-700">
    
    <div class="h-16 flex items-center justify-between px-4 border-b border-slate-200 dark:border-slate-700">
      <div class="flex items-center gap-3 overflow-hidden whitespace-nowrap">
        <div class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center shrink-0">
          <mat-icon class="text-white">local_hospital</mat-icon>
        </div>
        <span class="font-bold text-lg text-indigo-900 dark:text-indigo-200" [class.hidden]="!isSidebarOpen">
          MedERP
        </span>
      </div>
    </div>

    <!-- Navigation Menu (Dynamic based on Role) -->
    <nav class="flex-1 overflow-y-auto py-6 px-4 space-y-2">
      <ng-container *ngFor="let item of dynamicMenu()">
        <a [routerLink]="item.route" routerLinkActive="bg-indigo-600 !text-white shadow-lg shadow-indigo-200 dark:shadow-none"
           class="flex items-center gap-4 px-4 py-3.5 rounded-2xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/50 transition-all group font-bold">
          <mat-icon class="shrink-0 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors scale-110">{{ item.icon }}</mat-icon>
          <span [class.hidden]="!isSidebarOpen" class="truncate tracking-wide text-sm">{{ item.title }}</span>
        </a>
      </ng-container>
    </nav>

    <!-- Sidebar Footer -->
    <div class="p-4 border-t border-slate-200 dark:border-slate-700" *ngIf="authService.currentUserSignal() as user">
      <div class="flex items-center gap-3" [class.justify-center]="!isSidebarOpen">
        <div class="w-10 h-10 rounded-full bg-indigo-100 dark:bg-indigo-900/50 flex items-center justify-center shrink-0 text-indigo-600 dark:text-indigo-400 font-bold overflow-hidden">
          <img *ngIf="user.profilePicture" [src]="user.profilePicture" class="w-full h-full object-cover">
          <span *ngIf="!user.profilePicture">{{ user.firstName[0] }}</span>
        </div>
        <div [class.hidden]="!isSidebarOpen" class="overflow-hidden min-w-0 flex-1">
          <p class="text-sm font-bold text-slate-900 dark:text-white truncate">{{ user.firstName }} {{ user.lastName }}</p>
          <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest truncate">{{ user.role }}</p>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Content Wrapper -->
  <div class="flex-1 flex flex-col h-full min-w-0 relative overflow-hidden">
    <!-- Top Navbar -->
    <header class="h-20 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md shadow-sm border-b border-slate-200 dark:border-slate-800 z-40 flex items-center justify-between px-6 lg:px-10 shrink-0 sticky top-0">
      <div class="flex items-center gap-4">
        <button mat-icon-button (click)="toggleSidebar()" class="!bg-slate-50 dark:!bg-slate-800 text-slate-600 dark:text-slate-300">
          <mat-icon>{{ isSidebarOpen ? 'menu_open' : 'menu' }}</mat-icon>
        </button>
        <h2 class="hidden sm:block text-sm font-black text-slate-400 uppercase tracking-[0.2em]">Management System</h2>
      </div>

      <div class="flex items-center gap-6">
        <!-- Theme Toggle -->
        <button mat-icon-button (click)="themeService.toggleTheme()" class="!bg-slate-50 dark:!bg-slate-800 text-slate-600 dark:text-amber-400 shadow-sm">
          <mat-icon>{{ themeService.darkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
        </button>

        <button mat-icon-button class="text-slate-400 dark:text-slate-500 relative hover:text-indigo-600 transition-colors">
          <mat-icon>notifications</mat-icon>
          <span class="absolute top-2.5 right-2.5 w-2 h-2 bg-red-500 rounded-full border-2 border-white dark:border-slate-900"></span>
        </button>
        
        <ng-container *ngIf="authService.currentUserSignal() as user">
          <button mat-button [matMenuTriggerFor]="userMenu" class="!px-3 !py-2 !rounded-2xl hover:!bg-slate-50 dark:hover:!bg-slate-800 transition-all">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-2xl bg-indigo-600 flex items-center justify-center text-white font-bold text-sm shadow-lg shadow-indigo-200/50 overflow-hidden">
                <img *ngIf="user.profilePicture" [src]="user.profilePicture" class="w-full h-full object-cover">
                <span *ngIf="!user.profilePicture">{{ user.firstName[0] }}</span>
              </div>
              <div class="hidden lg:block text-left min-w-0">
                <p class="text-sm font-bold text-slate-800 dark:text-white leading-none truncate">{{ user.firstName }}</p>
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-wider mt-1">{{ user.role }}</p>
              </div>
              <mat-icon class="text-slate-400 scale-75">expand_more</mat-icon>
            </div>
          </button>
          <mat-menu #userMenu="matMenu" class="!mt-2 !rounded-xl !p-2">
            <div class="user-menu-header">
              <p>{{ user.email }}</p>
              <p>{{ user.role }}</p>
            </div>
            <button mat-menu-item routerLink="/profile">
              <mat-icon>person</mat-icon>
              <span>Profile</span>
            </button>
            <button mat-menu-item>
              <mat-icon>settings</mat-icon>
              <span>Settings</span>
            </button>
            <mat-divider class="!my-2"></mat-divider>
            <button mat-menu-item class="!text-red-600" (click)="logout()">
              <mat-icon class="text-red-600">logout</mat-icon>
              <span>Sign out</span>
            </button>
          </mat-menu>
        </ng-container>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto p-4 lg:p-8 relative z-0">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
